# LiveKit server config — single self-hosted node.
# WebRTC media flows DIRECTLY between apps and this server on UDP.
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: true

turn:
  enabled: true
  domain: rtc.onlinepuja.live
  # COTURN runs as its own container (see docker-compose.yml)
  tls_port: 5349

keys:
  # Key + secret pair — MUST match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in
  # Backend/.env. The setup script fills this from livekit.env.
  APIhpYpPzLbYhyV5: PLACEHOLDER_API_SECRET

logging:
  level: info
