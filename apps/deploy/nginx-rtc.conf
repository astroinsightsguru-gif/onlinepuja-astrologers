# nginx reverse proxy: wss://rtc.onlinepuja.live -> LiveKit on 127.0.0.1:7880
# Drop this into /etc/nginx/conf.d/ (or as a CyberCP vhost include) on the
# RTC VPS. TLS terminates here via acme.sh certs.
server {
    listen 443 ssl http2;
    server_name rtc.onlinepuja.live;

    ssl_certificate     /etc/letsencrypt/live/rtc.onlinepuja.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.onlinepuja.live/privkey.pem;

    # LiveKit signaling (WebSocket upgrade)
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # long-lived call sessions
        proxy_send_timeout 3600s;
    }
}
